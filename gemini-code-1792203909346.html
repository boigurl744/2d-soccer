<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer 2D Soccer</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #2c3e50; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; margin: 0 auto; background-color: #4CAF50; border: 4px solid #fff; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
        #scoreboard { display: flex; justify-content: center; align-items: center; gap: 20px; padding: 10px; background: rgba(0,0,0,0.5); color: white; font-size: 24px; font-weight: bold; }
        #timer { font-size: 32px; color: #f1c40f; }
        
        #landing-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 10; }
        .team-btn { padding: 15px 40px; margin: 10px; font-size: 20px; border: none; border-radius: 5px; cursor: pointer; transition: transform 0.2s; font-weight: bold; }
        .team-btn:hover { transform: scale(1.05); }
        #btn-home { background-color: #e74c3c; color: white; }
        #btn-away { background-color: #3498db; color: white; }
    </style>
</head>
<body>

    <!-- Landing Screen -->
    <div id="landing-screen">
        <h1>2D Multiplayer Soccer</h1>
        <h2>Choose Your Team</h2>
        <div>
            <button id="btn-home" class="team-btn">Join Home (Red)</button>
            <button id="btn-away" class="team-btn">Join Away (Blue)</button>
        </div>
        <p style="margin-top: 20px; font-size: 14px; max-width: 400px; text-align: center;">
            WASD to move. Mouse to aim. Click to shoot/pass (hold for power). Click near opponents to tackle.
        </p>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer" style="display: none;">
        <div id="scoreboard">
            <div>HOME <span id="score-home">0</span></div>
            <div id="timer">10:00</div>
            <div><span id="score-away">0</span> AWAY</div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="1000" height="600" style="display: none;"></canvas>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // TODO: REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Put the rest of the game logic here
        // (Canvas rendering, WASD inputs, mouse tracking, collision math, and Firebase sync loops)
        console.log("Firebase initialized. Game ready to mount.");
    </script>
</body>
</html>
